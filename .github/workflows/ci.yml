name: Enterprise Serverless & Cloud Multi-Runtime CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-node:
    name: Node.js Lambda Handlers (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'nodejs-handlers/package-lock.json'

      - name: Install Node Dependencies
        working-directory: ./nodejs-handlers
        run: npm ci

      - name: Run Jest Test Suite
        working-directory: ./nodejs-handlers
        run: npm test

  test-java:
    name: Java 21 Spring Boot Service (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test with Maven
        working-directory: ./java-claims-service
        run: mvn clean test

  test-python-and-iac:
    name: Python Handlers & Terraform IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: |
          cd terraform && terraform fmt -check

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v
