version: '3.8'

services:
  localstack:
    image: localstack/localstack:latest
    container_name: claims-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,s3,stepfunctions,events,sqs,sns,iam
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
